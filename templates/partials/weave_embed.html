{# templates/partials/weave_embed_inline.html — single-slider, cliff markers, dust fades #}
<div id="kw-scope" class="weave-scope">
  <!-- Absolute endpoint to work under any prefix/blueprint -->
  <a id="kw-endpoint" href="{{ url_for('weave.data') }}" style="display:none"></a>

  <!-- Controls -->
  <div class="kw-controls" style="margin-bottom:10px;">
    <label for="kw-lam" style="display:block;margin-bottom:6px;">λ (probe scale)</label>

    <div class="kw-slider-wrap" style="position:relative;">
      <input id="kw-lam" type="range" min="0" max="2.0" step="0.02" value="0.30" style="width:100%;">
      <!-- Cliff markers -->
      <div id="kw-cliff50" class="kw-cliff" title="R(λ)=0.5"></div>
      <div id="kw-cliff10" class="kw-cliff kw-cliff-weak" title="R(λ)=0.1"></div>
    </div>

    <div style="font-size:13px;color:var(--muted);margin-top:6px;">
      λ = <span id="kw-lam-val">0.30</span> · R(λ)=exp[−(λ/λ<sub>q</sub>)<sup>D<sub>eff</sub></sup>] → <strong id="kw-r-val">…</strong>
      <span id="kw-cliff-readout" style="margin-left:.75rem;"></span>
    </div>

    <div class="kw-grid" style="display:grid;grid-template-columns:1fr 1fr 1fr auto;gap:10px;align-items:end;margin-top:10px;">
      <div>
        <label for="kw-deff" style="display:block;margin-bottom:4px;">D<sub>eff</sub></label>
        <select id="kw-deff" style="width:100%;padding:6px;border:1px solid #334155;border-radius:8px;background:rgba(255,255,255,.06);color:var(--fg);">
          <option value="2.0">2.0 (filamentary)</option>
          <option value="2.2" selected>2.2 (default)</option>
          <option value="2.5">2.5</option>
          <option value="3.0">3.0 (homogenizing)</option>
        </select>
      </div>
      <div>
        <label for="kw-lq" style="display:block;margin-bottom:4px;">λ<sub>q</sub> (coherence)</label>
        <input id="kw-lq" type="number" min="0.2" step="0.1" value="1.0"
               style="width:100%;padding:6px;border:1px solid #334155;border-radius:8px;background:rgba(255,255,255,.06);color:var(--fg);">
      </div>
      <div>
        <label for="kw-seed" style="display:block;margin-bottom:4px;">Seed</label>
        <input id="kw-seed" type="number" value="42"
               style="width:120px;padding:6px;border:1px solid #334155;border-radius:8px;background:rgba(255,255,255,.06);color:var(--fg);">
      </div>
      <div style="display:flex;gap:10px;align-items:center;">
        <button id="kw-regen" class="btn"
                style="background:var(--accent);color:#fff;border:0;border-radius:10px;padding:8px 12px;font-weight:600;cursor:pointer;">
          Re-generate
        </button>
        <label style="font-size:.95rem;color:var(--muted);"><input id="kw-autos" type="checkbox" checked> Auto</label>
      </div>
    </div>
  </div>

  <!-- Plot -->
  <div id="kw-plot" style="height:560px;width:100%;"></div>
  <div id="kw-msg" style="font-size:13px;color:var(--muted);margin-top:6px;display:none;"></div>
</div>

<!-- Load Plotly once globally; remove if already loaded -->
<script src="https://cdn.plot.ly/plotly-2.35.2.min.js" defer></script>

<style>
  /* Palette per series */
  .weave-scope{
    --kw-filament: #2dd4bf; /* teal 400  */
    --kw-facet:    #f59e0b; /* amber 500 */
    --kw-hub:      #a78bfa; /* violet 400*/
    --kw-dust:     #94a3b8; /* slate 400 */
  }
  /* Transparent plot background */
  #kw-plot .plot-container, #kw-plot .svg-container { background: transparent !important; }

  /* Cliff markers on the slider */
  .kw-slider-wrap input[type="range"] { display:block; }
  .kw-cliff{
    position:absolute; top:50%; transform:translate(-50%,-50%);
    width:0; height:18px; border-left:2px dashed var(--accent);
    pointer-events:none; opacity:0.9;
  }
  .kw-cliff-weak{ border-left-style:solid; border-left-color: rgba(255,255,255,0.35); opacity:0.6; }

  /* Bigger legend dots */
  #kw-plot .legend .legendpoints path,
  #kw-plot .legend .legendpoints rect,
  #kw-plot .legend .legendlines path {
    transform: scale(1.6);
    transform-box: fill-box;
    transform-origin: 50% 50%;
  }

  @media (max-width: 900px){ .kw-grid { grid-template-columns: 1fr 1fr !important; } }
</style>

<script>
document.addEventListener('DOMContentLoaded', () => {
  const DATA_URL = document.getElementById('kw-endpoint').href;

  // Theme + series colors
  const root  = getComputedStyle(document.documentElement);
  const scope = getComputedStyle(document.getElementById('kw-scope'));
  const FG      = (root.getPropertyValue('--fg')||'#e5e7eb').trim();
  const MUTED   = (root.getPropertyValue('--muted')||'#9aa4b2').trim();
  const COL_FI  = (scope.getPropertyValue('--kw-filament')||'#2dd4bf').trim();
  const COL_FA  = (scope.getPropertyValue('--kw-facet')   ||'#f59e0b').trim();
  const COL_HU  = (scope.getPropertyValue('--kw-hub')     ||'#a78bfa').trim();
  const COL_DU  = (scope.getPropertyValue('--kw-dust')    ||'#94a3b8').trim();

  const elPlot=document.getElementById('kw-plot'), elMsg=document.getElementById('kw-msg');
  const elLam=document.getElementById('kw-lam'), elLamV=document.getElementById('kw-lam-val');
  const elR=document.getElementById('kw-r-val'), elDeff=document.getElementById('kw-deff');
  const elLq=document.getElementById('kw-lq'), elSeed=document.getElementById('kw-seed');
  const elRegen=document.getElementById('kw-regen'), elAutos=document.getElementById('kw-autos');
  const elCliff50=document.getElementById('kw-cliff50'), elCliff10=document.getElementById('kw-cliff10');
  const elCliffReadout=document.getElementById('kw-cliff-readout');

  const fmt = x => (+x).toFixed(2);
  const say = s => { elMsg.textContent=s; elMsg.style.display = s ? 'block' : 'none'; };

  // Retention
  function R(lam, lq, deff){ return Math.exp( - Math.pow(lam / lq, deff) ); }

  // Where R(λ)=τ -> λ_τ = λ_q * (-ln τ)^(1/Deff)
  function lambdaAtTau(tau, lq, deff){ return lq * Math.pow(-Math.log(tau), 1.0/deff); }

  function placeCliffs(){
    const lq = parseFloat(elLq.value), deff = parseFloat(elDeff.value);
    const lamMin = parseFloat(elLam.min), lamMax = parseFloat(elLam.max);
    const rect = elLam.getBoundingClientRect();
    const x0 = rect.left, w = rect.width;

    function setMarker(el, tau){
      let lamTau = lambdaAtTau(tau, lq, deff);
      lamTau = Math.max(lamMin, Math.min(lamMax, lamTau));
      const frac = (lamTau - lamMin) / (lamMax - lamMin);
      el.style.left = (frac * w) + 'px';
      return lamTau;
    }
    const lam50 = setMarker(elCliff50, 0.5);
    const lam10 = setMarker(elCliff10, 0.1);
    elCliffReadout.textContent = `cliffs: R=0.5 at λ≈${fmt(lam50)}, R=0.1 at λ≈${fmt(lam10)}`;
  }

  // Fetch
  async function fetchData(){
    const q = new URLSearchParams({ lam:elLam.value, lam_q:elLq.value, deff:elDeff.value, seed:elSeed.value });
    const r = await fetch(`${DATA_URL}?${q}`, { cache:'no-store' });
    if(!r.ok) throw new Error(`HTTP ${r.status}`);
    return r.json();
  }

  // Traces with opacity scaling so dust fades fast
  function makeTraces(data){
    // series opacities as powers of R: filaments fade slowest, dust fastest
    const r = R(parseFloat(elLam.value), parseFloat(elLq.value), parseFloat(elDeff.value));
    const alphaFil = 0.85 * Math.max(0.25, Math.pow(r, 0.4));
    const alphaFac = 0.85 * Math.pow(r, 0.9);
    const alphaHub = 0.85 * Math.pow(r, 1.2);
    const alphaDus = 0.85 * Math.pow(r, 2.2);

    // optional: shrink dust points at high λ
    const sizeDust = 2 * Math.max(0.35, Math.pow(r, 1.5));
    const sizeRest = 2;

    const N = k => data.traces[k].count;
    const series = [
      {k:'filament', name:`Filaments (${N('filament')})`, color:COL_FI, alpha:alphaFil, size:sizeRest},
      {k:'facet',    name:`Facets (${N('facet')})`,       color:COL_FA, alpha:alphaFac, size:sizeRest},
      {k:'hub',      name:`Hubs (${N('hub')})`,           color:COL_HU, alpha:alphaHub, size:sizeRest},
      {k:'dust',     name:`Dust (${N('dust')})`,          color:COL_DU, alpha:alphaDus, size:sizeDust}
    ];

    return series.map(({k,name,color,alpha,size})=>{
      const t = data.traces[k];
      return { type:'scatter3d', mode:'markers', name,
               x:t.x, y:t.y, z:t.z,
               marker:{ size, opacity:alpha, color } };
    });
  }

  function layout(){
    const grid='rgba(255,255,255,0.12)', zero='rgba(255,255,255,0.2)';
    return {
      paper_bgcolor:'rgba(0,0,0,0)', plot_bgcolor:'rgba(0,0,0,0)',
      font:{ color:FG, family:getComputedStyle(document.body).fontFamily },
      scene:{
        xaxis:{ title:'PC1', color:MUTED, gridcolor:grid, zerolinecolor:zero },
        yaxis:{ title:'PC2', color:MUTED, gridcolor:grid, zerolinecolor:zero },
        zaxis:{ title:'PC3', color:MUTED, gridcolor:grid, zerolinecolor:zero },
        aspectmode:'cube'
      },
      margin:{ l:0, r:0, t:20, b:0 },
      showlegend:true,
      legend:{ orientation:'v', x:0.82, y:0.98, font:{ size:11, color:MUTED } },
      title:{ text:'10D→4D Projection: principal 3D view (facets + filaments)', x:0.02, font:{ size:13, color:MUTED } }
    };
  }

  function bumpLegendDots(scale=1.6){
    ['.legend .legendpoints path','.legend .legendpoints rect','.legend .legendlines path']
      .forEach(s => document.querySelectorAll(`#kw-plot ${s}`).forEach(el => {
        el.style.transform = `scale(${scale})`;
        el.style.transformBox = 'fill-box';
        el.style.transformOrigin = '50% 50%';
      }));
  }

  async function update(){
    try{
      const data = await fetchData();
      const r = R(parseFloat(elLam.value), parseFloat(elLq.value), parseFloat(elDeff.value));
      elLamV.textContent = fmt(elLam.value);
      elR.textContent = r.toFixed(3);

      const tr = makeTraces(data);
      const ly = layout();

      if(!elPlot._plotted){ Plotly.newPlot(elPlot, tr, ly, {responsive:true}).then(()=>bumpLegendDots()); elPlot._plotted=true; }
      else { Plotly.react(elPlot, tr, ly, {responsive:true}).then(()=>bumpLegendDots()); }
    }catch(e){ say(`Could not load data (${e.message}). Check ${DATA_URL}.`); }
  }

  // Events
  function onParamsChanged(){
    placeCliffs();
    if(document.getElementById('kw-autos').checked) update();
    else {
      // even without autos, keep readouts correct
      const r = R(parseFloat(elLam.value), parseFloat(elLq.value), parseFloat(elDeff.value));
      elLamV.textContent = fmt(elLam.value); elR.textContent = r.toFixed(3);
    }
  }
  elLam.addEventListener('input', onParamsChanged);
  elLam.addEventListener('change', onParamsChanged);
  elDeff.addEventListener('change', onParamsChanged);
  elLq.addEventListener('change', onParamsChanged);
  elRegen.addEventListener('click', ()=>{ elSeed.value=(Math.random()*1e6)|0; update(); });
  window.addEventListener('resize', placeCliffs);

  // First render
  update().then(placeCliffs);
});
</script>
